<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Frosted Glass Translucent Gradient -->
    <linearGradient id="squircleGlass" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="45%" stop-color="#3730A3" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>

    <!-- Glowing Electric Rim Gradient -->
    <linearGradient id="electricRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8" />
    </linearGradient>

    <!-- Internal Radial Caustic Glow -->
    <radialGradient id="innerGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#4F46E5" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Verified Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312E81" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366F1" flood-opacity="0.3" />
    </filter>

    <!-- Neon Glow Filter for Glyph -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#A5B4FC" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Main Frosted Glass Squircle (Fills frame cleanly with transparent exterior) -->
  <g filter="url(#softShadow)">
    <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#squircleGlass)" />
    <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#innerGlow)" />
    <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#electricRim)" stroke-width="4" />
  </g>

  <!-- Subtle Top-Left Specular Reflection -->
  <path d="M56 120 C 56 65, 95 36, 150 32 C 100 48, 64 80, 56 120 Z" fill="#FFFFFF" fill-opacity="0.25" />

  <!-- Luminous Document & Rupee Emblem -->
  <g filter="url(#neonGlow)">
    
    <!-- Invoice Document Background Translucency -->
    <path d="M 160 116 
             H 296 
             L 356 176 
             V 380 
             C 356 393.25 345.25 404 332 404 
             H 160 
             C 146.75 404 136 393.25 136 380 
             V 140 
             C 136 126.75 146.75 116 160 116 Z" 
          fill="#FFFFFF" fill-opacity="0.06" />

    <!-- Invoice Document Outline with Folded Top-Right Corner -->
    <path d="M 160 116 
             H 296 
             L 356 176 
             V 380 
             C 356 393.25 345.25 404 332 404 
             H 160 
             C 146.75 404 136 393.25 136 380 
             V 140 
             C 136 126.75 146.75 116 160 116 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Folded Corner Flap -->
    <path d="M 296 116 V 176 H 356" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Top Document Lines -->
    <line x1="176" y1="170" x2="256" y2="170" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
    <line x1="176" y1="198" x2="226" y2="198" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-opacity="0.75" />

    <!-- Perfectly Curved Indian Rupee Symbol (₹) -->
    <!-- Top Horizontal Bar -->
    <line x1="194" y1="248" x2="278" y2="248" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />
    <!-- Second Horizontal Bar -->
    <line x1="194" y1="274" x2="268" y2="274" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />
    <!-- Rupee Upper Loop -->
    <path d="M 224 248 
             V 298 
             C 258 298, 276 288, 276 268 
             C 276 248, 256 248, 224 248" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Rupee Diagonal Leg -->
    <line x1="226" y1="298" x2="278" y2="352" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" />

    <!-- Bottom Total Indicator Line -->
    <line x1="176" y1="362" x2="216" y2="362" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-opacity="0.5" />

    <!-- Verified Badge (Bottom Right Corner of Document) -->
    <g transform="translate(340, 360)">
      <circle cx="0" cy="0" r="38" fill="url(#badgeGrad)" stroke="#FFFFFF" stroke-width="7" />
      <path d="M -14 0 L -4 10 L 16 -10" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    </g>

  </g>
</svg>